<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高考题模型对比</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: normal;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
        }
        .result-card h3 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .result-content {
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            font-size: 1rem;
        }
        .result-content :deep(katex) {
            font-size: 1.1em;
        }
        .model-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-student {
            background: #e3f2fd;
            color: #1976d2;
        }
        .badge-teacher {
            background: #fff3e0;
            color: #f57c00;
        }
        .badge-distilled {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .tip {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .math-render {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 高考题模型对比</h1>
            <p>对比原始学生模型、教师模型和蒸馏后学生模型的回答</p>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="question">输入高考题目：</label>
                <textarea id="question" placeholder="请输入高考题目，支持 LaTeX 数学公式..."></textarea>
            </div>

            <div class="form-group">
                <label>选择显示的模型：</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="model" value="student" id="cb-student">
                        <span>📚 原始学生模型 (Qwen2.5-0.5B)</span>
                    </label>
                    <label>
                        <input type="checkbox" name="model" value="teacher" id="cb-teacher">
                        <span>👨‍🏫 教师模型 (Qwen2.5-3B)</span>
                    </label>
                    <label>
                        <input type="checkbox" name="model" value="distilled" checked>
                        <span>✨ 蒸馏后学生模型</span>
                    </label>
                </div>
            </div>

            <button id="submit-btn">
                生成回答
                <span id="loading-spinner" class="loading" style="display: none;"></span>
            </button>
        </div>

        <div id="results" class="card">
            <h2 style="margin-bottom: 20px; color: #333;">回答结果</h2>
            <div id="results-content"></div>
        </div>

        <div class="tip">
            <strong>💡 提示：</strong>
            <ul>
                <li>支持 LaTeX 数学公式，例如：<code>$x^2 + y^2 = r^2$</code></li>
                <li>首次加载模型可能需要几分钟，请耐心等待</li>
                <li>建议只选择需要对比的模型以加快响应速度</li>
            </ul>
        </div>
    </div>

    <script>
        document.getElementById('submit-btn').addEventListener('click', async function() {
            const question = document.getElementById('question').value.trim();
            if (!question) {
                alert('请输入题目');
                return;
            }

            const models = Array.from(document.querySelectorAll('input[name="model"]:checked'))
                .map(cb => cb.value);

            if (models.length === 0) {
                alert('请至少选择一个模型');
                return;
            }

            const btn = document.getElementById('submit-btn');
            const spinner = document.getElementById('loading-spinner');
            const resultsContent = document.getElementById('results-content');

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            resultsContent.innerHTML = '';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: question,
                        models: models
                    })
                });

                const data = await response.json();

                if (data.error) {
                    resultsContent.innerHTML = `<div class="error">❌ ${data.error}</div>`;
                    return;
                }

                const modelNames = {
                    student: { name: '原始学生模型', badge: 'badge-student', emoji: '📚', subtitle: '(Qwen2.5-0.5B)' },
                    teacher: { name: '教师模型', badge: 'badge-teacher', emoji: '👨‍🏫', subtitle: '(Qwen2.5-3B)' },
                    distilled: { name: '蒸馏后学生模型', badge: 'badge-distilled', emoji: '✨', subtitle: '' }
                };

                models.forEach(model => {
                    if (data.results[model]) {
                        const info = modelNames[model];
                        const html = marked.parse(data.results[model]);
                        const container = document.createElement('div');
                        container.className = 'result-card';
                        container.innerHTML = `
                            <h3>
                                ${info.emoji} ${info.name}
                                <span class="model-badge ${info.badge}">${info.subtitle}</span>
                            </h3>
                            <div class="result-content">${html}</div>
                        `;
                        resultsContent.appendChild(container);
                        renderMathInElement(container);
                    }
                });

            } catch (error) {
                resultsContent.innerHTML = `<div class="error">❌ 请求失败：${error.message}</div>`;
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        });

        function renderMathInElement(element) {
            const textNodes = [];
            const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            let node;
            while ((node = walker.nextNode())) {
                textNodes.push(node);
            }

            textNodes.forEach(node => {
                const text = node.textContent;
                const replaced = text.replace(/\$\$(.*?)\$\$/g, '<span class="math-render">$$$1$$</span>')
                                   .replace(/\$(.*?)\$/g, '<span class="math-render">$($1)</span>');
                if (replaced !== text) {
                    const span = document.createElement('span');
                    span.innerHTML = replaced;
                    node.parentNode.replaceChild(span, node);
                }
            });

            katex.renderInElement(element, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ]
            });
        }
    </script>
</body>
</html>
